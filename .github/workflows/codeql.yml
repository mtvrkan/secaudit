name: CodeQL

# Why a third analyser, in a repository that already runs ruff, mypy and its own engine against
# its own source: those three answer different questions. ruff is lexical, mypy is types, and
# the dogfood gate runs THIS engine on itself — which is exactly the check that cannot find a
# class of bug the engine does not model. CodeQL's dataflow is the only reading here that is
# not ours, and a scanner whose own repository is only ever scanned by itself has a blind spot
# shaped precisely like its own limitations.
#
# Findings land in the Security tab as SARIF. Nothing about that gates a merge today; treat a
# CodeQL alert the way `what-we-miss.md` treats a missed class — something to answer, in
# writing, not something to silence.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # So the analysis can be re-run without a commit — a query-pack update finds things in code
  # that has not changed, and waiting for the weekly cron to prove that is a slow way to ask.
  workflow_dispatch:
  schedule:
    # A weekly run catches a query-pack update finding something in code that has not changed.
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest

    # CodeQL is free for public repositories; on a private one it needs GitHub Advanced
    # Security, which this repository does not have. Without this gate every push while the
    # repository is still private would produce a red build for a reason no contributor could
    # fix, and a permanently-red workflow is one everybody learns to ignore — including on the
    # day it goes red for a real finding.
    #
    # Flip it on at launch: Settings → Secrets and variables → Actions → Variables →
    # `ENABLE_CODEQL` = `true`. Tracked as step 4c in `.claude/LAUNCH-CHECKLIST.md` — this comment
    # used to say "tracked with the other launch steps in ROADMAP.md" and it was not tracked
    # anywhere, which is how a launch step spends months existing only inside the file it gates.
    if: vars.ENABLE_CODEQL == 'true'

    permissions:
      # Job-scoped, not workflow-scoped: every other job in this repository runs holding no
      # token that can write anything, and `security-events: write` is exactly the scope that
      # should not be sitting on a checkout step.
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Pinned to the commit behind release codeql-bundle-v2.26.3, resolved through the GitHub
      # API rather than written from memory — an unverified 40-hex string is worse than a tag,
      # because it looks pinned. Dependabot watches this file for the update.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          languages: python
          # `security-and-quality` over the default `security-extended`: this repository's
          # standard for its own findings is the one it asks of others, and the quality queries
          # are where the dead-code and unreachable-branch results live.
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          category: "/language:python"
