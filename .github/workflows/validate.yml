name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:
  # So a release can re-run the whole suite against the exact tagged commit rather than
  # trusting that main was green when the tag was cut.
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing, not caution. Check 30 asserts that every `## [x.y.z]`
      # heading in CHANGELOG.md has a matching `vx.y.z` tag, and the default shallow checkout
      # fetches no tags at all — it would answer "this repository has no tags" for a repository
      # that has them and fail the build on the first correct release. The gate refuses to treat
      # an unanswerable question as a pass, so the answer has to actually be available here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Pinned rather than left to whatever `python3` ubuntu-latest happens to ship. A runner
      # image bump moving the default interpreter would otherwise change what this suite ran
      # against without a single line of this file changing — and the version the gates run on
      # is part of what a green build means.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Install the three tools the suite cannot bring with it. Pinned like every other tool
      # in this workflow: an unpinned linter is a supply-chain hole in a pipeline whose job is
      # to complain about supply-chain holes. pytest and coverage are here for the coverage
      # gate; the suites themselves run on the standard library and need neither.
      - name: Install the quality toolchain (pinned)
        run: python3 -m pip install --disable-pip-version-check
          "ruff==0.9.6" "mypy==2.3.0" "coverage==7.15.4" "pytest==8.3.4"

      # Every gate, through the same runner a contributor runs. This step used to be twenty
      # hand-written ones, and `scripts/run_checks.py` listed the same gates a second time for
      # local use — two copies of one list, with nothing comparing them. The Windows job below
      # already called the runner; this makes both platforms run the same thing, and check 26
      # in `scripts/check_consistency.py` now fails the build if any check script in the
      # repository is missing from that list.
      #
      # `--require` is what stops the lint/type gates from degrading here: they SKIP when the
      # tool is absent so a fresh clone still runs, and CI must never take that path.
      - name: All gates (scripts/run_checks.py)
        run: python3 scripts/run_checks.py

      - name: Lint, types and the coverage floor (must not skip in CI)
        run: python3 scripts/check_quality.py --lint --types --coverage --require

      - name: Validate the exported rules against real Semgrep
        run: pipx run --spec "semgrep==1.140.0" semgrep --validate --config rules/secaudit/

      - name: Self-lint workflows with zizmor (SHA-pinning / injection)
        run: |
          set -e
          # Pinned + blocking: a security tool must gate its own supply-chain hygiene.
          # `pipx run` isolates the install (PEP-668 safe on ubuntu-latest, no venv juggling).
          # Bump the pin deliberately when upgrading (see https://pypi.org/project/zizmor/).
          pipx run --spec "zizmor==1.26.1" zizmor --persona=regular .github/workflows/

  # The same gate set on Windows. Not redundancy: this kit makes Windows-specific claims and
  # nothing was checking them. The hook ships an interpreter fallback chain because Windows
  # python.org installs have no `python3`; the engine normalises `\` into the `/` paths every
  # finding, SARIF location and golden-set id is keyed on; `npm audit` is invoked with
  # `shell=True` only on `nt`; and diff mode shells out to git. Each of those is a path that
  # ubuntu-latest cannot execute even once.
  #
  # It runs `scripts/run_checks.py` — the same gate list, through one runner that sets PYTHONPATH
  # and forces UTF-8 output itself, rather than a second copy of the step list above that would
  # drift from it. Not a `matrix` on the job above for the same reason the platform-specific
  # steps (pipx/semgrep/zizmor) belong to Linux only: they are not what this job is for.
  #
  # The count that used to be written here said 32 while the runner listed 35, for long enough
  # that nobody read it as a claim any more. Check 29 in `scripts/check_consistency.py` now
  # derives the number and fails the build on any typed one, here or in any doc.
  validate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0    # tags — see the note on the same line in the `validate` job

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: All gates on Windows (path handling, interpreter fallback, git + npm shell-out)
        run: python scripts/run_checks.py
