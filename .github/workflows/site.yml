name: Publish site

# The page is regenerated from the repository on every push to main, so a figure on it can
# never lag the code that produced it. `gen_site.py --check` also runs in the validation
# workflow, which means a pull request that would publish a stale or hand-typed number fails
# before it merges rather than after it is live.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only for the workflow as a whole. The two write scopes Pages needs belong to the one job
# that deploys, not to every job in the file: `build` runs a generator over repository content
# and checks out the tree, and a token that can publish a site is not something a build step
# should be holding while it does that.
permissions:
  contents: read

# Never publish two builds at once; let an in-flight one finish rather than cancelling it,
# since the second would only overwrite what the first is mid-way through uploading.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Render the page from repository facts
        run: python3 scripts/gen_site.py
        env:
          PYTHONPATH: kit

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write            # publish the uploaded artifact
      id-token: write         # OIDC token deploy-pages exchanges for the deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
