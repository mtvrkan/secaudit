# SECURE COUNTERPART — SecAudit negative-control fixture. Not a real workflow.
name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # S53 — Action pinned to an immutable commit (CWE-1357 fixed). Dependabot can still bump
      # the pin; what it cannot do is change underneath one.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # S54 — Download, verify, then execute (CWE-494 fixed): the checksum is the part that
      # makes this different from trusting whatever the server returns today.
      - name: install
        run: |
          curl -sSLo install.sh https://example.com/install.sh
          echo "b3a1c0de  install.sh" | sha256sum -c -
          sh ./install.sh
