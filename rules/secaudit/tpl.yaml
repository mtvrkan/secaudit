rules:
  - id: secaudit.sec-tpl-safe-filter
    message: 'Escaping explicitly disabled on a template variable (|safe) (CWE-79, OWASP A03). Escape the value — drop `|safe` and let the template escape it, or sanitize the HTML with a real sanitizer (bleach, nh3) before marking it safe. `|safe` on any value that reaches the page from a request is stored or reflected XSS.'
    languages: [regex]
    severity: ERROR
    patterns:
      - pattern-regex: '(?im)\{\{[^}]*\|\s*safe\b'
    paths:
      include:
        - '*.html'
        - '*.htm'
        - '*.jinja'
        - '*.jinja2'
        - '*.j2'
      exclude:
