  - id: secaudit.sec-tpl-autoescape-off
    message: 'Template block with autoescaping switched off (CWE-79, OWASP A03). Turn autoescaping back on and mark only the individual values that are genuinely trusted HTML. A block-level `off` silently covers every variable added to it later, including the one somebody adds next year.'
    languages: [regex]
    severity: ERROR
    patterns:
      - pattern-regex: '(?im)\{%\s*autoescape\s+(?:off|false)\s*%\}'
    paths:
