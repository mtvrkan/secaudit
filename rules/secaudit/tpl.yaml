  - id: secaudit.sec-tpl-xss-js-attr
    message: 'Template variable interpolated into a JavaScript event handler (CWE-79, OWASP A03). Move the value out of the attribute: render it into a `data-` attribute and read it with `dataset` from a real script block, or emit it as JSON through a JS-context escaper. HTML escaping does not make a value safe inside JavaScript.'
