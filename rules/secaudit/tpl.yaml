  - id: secaudit.sec-tpl-error-object
    message: 'Exception internals rendered into the page (CWE-209, OWASP A09). Render a message and an incident id. A traceback or a dumped exception object hands the reader your file paths, framework versions, and often the query that failed with its values still in it.'
