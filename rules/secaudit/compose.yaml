# SecAudit detector pack — `compose` group (1 rules).
#
# Generated by `python3 scripts/gen_semgrep_pack.py` from kit/secaudit_core/detectors.py.
# Do not edit by hand; CI fails on drift. See ../README.md for what is deliberately
# NOT in this pack and why.
rules:
  - id: secaudit.sec-compose-envsecret
    message: 'Secret written into a Compose environment entry (CWE-798, OWASP A05). Reference the value instead of writing it: `- SECRET_KEY=${SECRET_KEY}` with the real value in an untracked `.env`, or a secrets mount.'
    languages: [regex]
    severity: ERROR
    patterns:
      - pattern-regex: '(?im)^\s*-\s*\w*(?:TOKEN|SECRET|PASSWORD|PASSWD|API_KEY|ACCESS_KEY)\w*\s*=\s*(?![\s$])(?![^\n]*<[^\n]*>)\S+'
    paths:
      include:
        - '*.yml'
        - '*.yaml'
    metadata:
      cwe: 'CWE-798'
      owasp: 'A05'
      secaudit-id: 'SEC-COMPOSE-ENVSECRET'
      secaudit-severity: 'High'
      confidence: 'HIGH'
      category: security
      source: 'https://github.com/mtvrkan/secaudit'
      # This rule matches credential material. Semgrep prints the matched line; SecAudit redacts it.
