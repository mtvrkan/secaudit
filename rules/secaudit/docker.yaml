        - '**/test.py*'
        - '**/test/**'
        - '**/test_*'
        - '**/tests.py*'
        - '**/tests/**'
    metadata:
      cwe: 'CWE-494'
      owasp: 'A08'
      secaudit-id: 'SEC-DOCKER-CURLSH'
      secaudit-severity: 'High'
      confidence: 'HIGH'
      category: security
      source: 'https://github.com/mtvrkan/secaudit'
  - id: secaudit.sec-docker-userroot
    message: 'Container explicitly runs as root (CWE-250, OWASP A05). Run as a non-root user.'
    languages: [regex]
    severity: WARNING
    patterns:
      - pattern-regex: '(?im)^USER\s+root\b'
    paths:
      include:
        - 'Dockerfile'
      exclude:
