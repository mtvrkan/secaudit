# SecAudit detector pack — `docker` group (4 rules).
#
# Generated by `python3 scripts/gen_semgrep_pack.py` from kit/secaudit_core/detectors.py.
# Do not edit by hand; CI fails on drift. See ../README.md for what is deliberately
# NOT in this pack and why.
rules:
  - id: secaudit.sec-docker-latest
    message: 'Unpinned base image (:latest) (CWE-1104, OWASP A06). Pin the base image by version and ideally by @sha256 digest.'
    languages: [regex]
    severity: WARNING
    patterns:
      - pattern-regex: '(?im)^FROM\s+\S+:latest\b'
    paths:
      include:
        - 'Dockerfile'
      exclude:
        - '**/*_factory.py'
        - '**/*_seed.py'
        - '**/*_test.py'
        - '**/*conftest.py'
        - '**/*seed.py'
        - '**/*seed_'
        - '**/*seeds.py'
        - '**/*seeds.rb'
        - '**/*test.py'
        - '**/*test_'
        - '**/*tests.py'
        - '**/_factory.py*'
        - '**/_seed.py*'
        - '**/_test.py*'
        - '**/benchmarks/**'
        - '**/conftest.py*'
        - '**/examples/**'
        - '**/factories/**'
        - '**/fixtures/**'
        - '**/management/commands/**'
        - '**/migrations/**'
        - '**/samples/**'
        - '**/scripts/**'
        - '**/seed.py*'
        - '**/seed_*'
        - '**/seeders/**'
        - '**/seeds.py*'
        - '**/seeds.rb*'
        - '**/seeds/**'
        - '**/test.py*'
        - '**/test/**'
        - '**/test_*'
        - '**/tests.py*'
        - '**/tests/**'
    metadata:
      cwe: 'CWE-1104'
      owasp: 'A06'
      secaudit-id: 'SEC-DOCKER-LATEST'
      secaudit-severity: 'Medium'
      confidence: 'HIGH'
      category: security
      source: 'https://github.com/mtvrkan/secaudit'
  - id: secaudit.sec-docker-envsecret
    message: 'Secret baked into image ENV (CWE-798, OWASP A05). Inject secrets at runtime (--env / mounted file); never bake them into the image.'
    languages: [regex]
    severity: ERROR
    patterns:
      - pattern-regex: '(?im)^ENV\s+\w*(?:TOKEN|SECRET|KEY|PASSWORD)\w*\s*='
    paths:
      include:
        - 'Dockerfile'
      exclude:
        - '**/*_factory.py'
        - '**/*_seed.py'
        - '**/*_test.py'
        - '**/*conftest.py'
        - '**/*seed.py'
        - '**/*seed_'
        - '**/*seeds.py'
        - '**/*seeds.rb'
        - '**/*test.py'
        - '**/*test_'
        - '**/*tests.py'
        - '**/_factory.py*'
        - '**/_seed.py*'
        - '**/_test.py*'
        - '**/benchmarks/**'
        - '**/conftest.py*'
        - '**/examples/**'
        - '**/factories/**'
        - '**/fixtures/**'
        - '**/management/commands/**'
        - '**/migrations/**'
        - '**/samples/**'
        - '**/scripts/**'
        - '**/seed.py*'
        - '**/seed_*'
        - '**/seeders/**'
        - '**/seeds.py*'
        - '**/seeds.rb*'
        - '**/seeds/**'
        - '**/test.py*'
        - '**/test/**'
        - '**/test_*'
        - '**/tests.py*'
        - '**/tests/**'
    metadata:
      cwe: 'CWE-798'
      owasp: 'A05'
      secaudit-id: 'SEC-DOCKER-ENVSECRET'
      secaudit-severity: 'High'
      confidence: 'HIGH'
      category: security
      source: 'https://github.com/mtvrkan/secaudit'
      # This rule matches credential material. Semgrep prints the matched line; SecAudit redacts it.
  - id: secaudit.sec-docker-curlsh
    message: 'Remote script piped to a shell in RUN (CWE-494, OWASP A08). Download, verify a checksum/signature, then execute — never pipe curl to a shell.'
    languages: [regex]
    severity: ERROR
    patterns:
      - pattern-regex: '(?im)RUN[^\n]*\bcurl\b[^\n]*\|\s*(?:sh|bash)\b'
    paths:
      include:
        - 'Dockerfile'
      exclude:
        - '**/*_factory.py'
        - '**/*_seed.py'
        - '**/*_test.py'
        - '**/*conftest.py'
