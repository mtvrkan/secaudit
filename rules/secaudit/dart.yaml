        - '**/_test.py*'
        - '**/benchmarks/**'
        - '**/conftest.py*'
        - '**/examples/**'
        - '**/factories/**'
        - '**/fixtures/**'
        - '**/management/commands/**'
        - '**/migrations/**'
        - '**/samples/**'
        - '**/scripts/**'
        - '**/seed.py*'
        - '**/seed_*'
        - '**/seeders/**'
