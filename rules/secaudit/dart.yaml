# SecAudit detector pack — `dart` group (1 rules).
#
# Generated by `python3 scripts/gen_semgrep_pack.py` from kit/secaudit_core/detectors.py.
# Do not edit by hand; CI fails on drift. See ../README.md for what is deliberately
# NOT in this pack and why.
rules:
  - id: secaudit.sec-dart-badcert
    message: 'Flutter accepts any TLS certificate (CWE-295, OWASP A02). Never return true for all certs; pin or validate properly.'
    languages: [regex]
    severity: ERROR
    patterns:
      - pattern-regex: '(?im)badCertificateCallback\s*='
    paths:
      include:
        - '*.dart'
    metadata:
      cwe: 'CWE-295'
      owasp: 'A02'
      secaudit-id: 'SEC-DART-BADCERT'
      secaudit-severity: 'High'
      confidence: 'HIGH'
      category: security
      source: 'https://github.com/mtvrkan/secaudit'
