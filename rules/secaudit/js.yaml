    message: 'SQL injection via string concatenation (CWE-89, OWASP A03). Use parameterized queries / prepared statements; never concatenate input into SQL.'
    languages: [regex]
    severity: ERROR
    patterns:
      - pattern-regex: '(?im)(?:SELECT\b[^;\n]*\bFROM\b|INSERT\s+INTO\b|UPDATE\b[^;\n]*\bSET\b|DELETE\s+FROM\b)[^;\n]*[''\"]\s*\+'
    paths:
      include:
        - '*.js'
        - '*.jsx'
        - '*.mjs'
        - '*.cjs'
        - '*.ts'
        - '*.tsx'
        - '*.mts'
