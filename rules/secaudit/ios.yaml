# SecAudit detector pack — `ios` group (1 rules).
#
# Generated by `python3 scripts/gen_semgrep_pack.py` from kit/secaudit_core/detectors.py.
# Do not edit by hand; CI fails on drift. See ../README.md for what is deliberately
# NOT in this pack and why.
rules:
  - id: secaudit.sec-ios-ats
    message: 'App Transport Security disabled (CWE-319, OWASP A02). Keep ATS on; allow-list specific domains instead of disabling it globally.'
    languages: [regex]
    severity: ERROR
    patterns:
      - pattern-regex: '(?im)NSAllowsArbitraryLoads'
    paths:
      include:
        - '*.plist'
        - '*.xml'
        - '*.swift'
    metadata:
      cwe: 'CWE-319'
      owasp: 'A02'
      secaudit-id: 'SEC-IOS-ATS'
      secaudit-severity: 'High'
      confidence: 'HIGH'
      category: security
      source: 'https://github.com/mtvrkan/secaudit'
