# SecAudit detector pack — `py` group (2 rules).
#
# Generated by `python3 scripts/gen_semgrep_pack.py` from kit/secaudit_core/detectors.py.
# Do not edit by hand; CI fails on drift. See ../README.md for what is deliberately
# NOT in this pack and why.
rules:
  - id: secaudit.sec-py-allowed-hosts
    message: 'ALLOWED_HOSTS accepts any Host header (CWE-16, OWASP A05). List the hostnames you serve. `[''*'']` enables Host-header injection, cache poisoning and password-reset poisoning.'
    languages: [regex]
    severity: WARNING
    patterns:
      - pattern-regex: '(?im)^\s*ALLOWED_HOSTS\s*=\s*\[\s*[''\"]\*[''\"]'
    paths:
      include:
        - '*.py'
    metadata:
      cwe: 'CWE-16'
      owasp: 'A05'
      secaudit-id: 'SEC-PY-ALLOWED-HOSTS'
      secaudit-severity: 'Medium'
      confidence: 'MEDIUM'
      category: security
      source: 'https://github.com/mtvrkan/secaudit'
  - id: secaudit.sec-py-secret-key-fallback
    message: 'Signing key falls back to a literal committed in the source (CWE-321, OWASP A02). Fail closed when the variable is missing rather than falling back: a committed default key is a published key.'
    languages: [regex]
    severity: ERROR
    patterns:
      - pattern-regex: '(?im)^\s*(?:SECRET_KEY|JWT_SECRET\w*|\w*_SECRET_KEY)\s*=\s*(?:os\.)?(?:environ\.get|getenv)\s*\(\s*[^)]*,\s*[''\"][^''\"]{8,}[''\"]'
    paths:
      include:
        - '*.py'
    metadata:
      cwe: 'CWE-321'
      owasp: 'A02'
      secaudit-id: 'SEC-PY-SECRET-KEY-FALLBACK'
      secaudit-severity: 'High'
      confidence: 'HIGH'
      category: security
      source: 'https://github.com/mtvrkan/secaudit'
      # This rule matches credential material. Semgrep prints the matched line; SecAudit redacts it.
