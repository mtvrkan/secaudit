# SecAudit detector pack — `header` group (1 rules).
#
# Generated by `python3 scripts/gen_semgrep_pack.py` from kit/secaudit_core/detectors.py.
# Do not edit by hand; CI fails on drift. See ../README.md for what is deliberately
# NOT in this pack and why.
rules:
  - id: secaudit.sec-header-disabled
    message: 'Browser security header explicitly disabled (CWE-1021, OWASP A05). Remove the override and let the header do its job: DENY or SAMEORIGIN for framing, a real Content-Security-Policy, nosniff for content type.'
    languages: [regex]
    severity: WARNING
    patterns:
      - pattern-regex: '(?im)[''\"](?:X-Frame-Options|X-XSS-Protection|Content-Security-Policy|Strict-Transport-Security|X-Content-Type-Options|Referrer-Policy)[''\"]\s*(?:\]\s*=|[:,])\s*[''\"](?:0|ALLOWALL|ALLOW-FROM \*|)[''\"]'
    paths:
      include:
        - '*.js'
        - '*.jsx'
        - '*.mjs'
        - '*.cjs'
        - '*.ts'
        - '*.tsx'
        - '*.mts'
        - '*.cts'
        - '*.py'
      exclude:
        - '**/*_factory.py'
        - '**/*_seed.py'
        - '**/*_test.py'
        - '**/*conftest.py'
        - '**/*seed.py'
        - '**/*seed_'
        - '**/*seeds.py'
        - '**/*seeds.rb'
        - '**/*test.py'
        - '**/*test_'
        - '**/*tests.py'
        - '**/_factory.py*'
        - '**/_seed.py*'
        - '**/_test.py*'
        - '**/benchmarks/**'
        - '**/conftest.py*'
        - '**/examples/**'
        - '**/factories/**'
        - '**/fixtures/**'
        - '**/management/commands/**'
        - '**/migrations/**'
        - '**/samples/**'
        - '**/scripts/**'
        - '**/seed.py*'
        - '**/seed_*'
        - '**/seeders/**'
        - '**/seeds.py*'
        - '**/seeds.rb*'
        - '**/seeds/**'
        - '**/test.py*'
        - '**/test/**'
        - '**/test_*'
        - '**/tests.py*'
        - '**/tests/**'
    metadata:
      cwe: 'CWE-1021'
      owasp: 'A05'
      secaudit-id: 'SEC-HEADER-DISABLED'
      secaudit-severity: 'Medium'
      confidence: 'MEDIUM'
      category: security
      source: 'https://github.com/mtvrkan/secaudit'
