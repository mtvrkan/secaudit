# SecAudit detector pack — `ai` group (1 rules).
#
# Generated by `python3 scripts/gen_semgrep_pack.py` from kit/secaudit_core/detectors.py.
# Do not edit by hand; CI fails on drift. See ../README.md for what is deliberately
# NOT in this pack and why.
rules:
  - id: secaudit.sec-ai-shell-tool
    message: 'Agent shell/terminal tool exposed to the model (CWE-78, OWASP A05). Giving an LLM a shell is excessive agency; drop it or constrain to an allowlisted command set.'
    languages: [regex]
    severity: WARNING
    patterns:
      - pattern-regex: '(?im)\bShellTool\b|load_tools\(\s*\[[^\]]*[''\"](?:terminal|shell)[''\"]'
    paths:
      include:
        - '*.py'
      exclude:
        - '**/*_factory.py'
        - '**/*_seed.py'
        - '**/*_test.py'
        - '**/*conftest.py'
        - '**/*seed.py'
        - '**/*seed_'
        - '**/*seeds.py'
        - '**/*seeds.rb'
        - '**/*test.py'
        - '**/*test_'
        - '**/*tests.py'
        - '**/_factory.py*'
        - '**/_seed.py*'
        - '**/_test.py*'
        - '**/benchmarks/**'
        - '**/conftest.py*'
        - '**/examples/**'
        - '**/factories/**'
        - '**/fixtures/**'
        - '**/management/commands/**'
        - '**/migrations/**'
        - '**/samples/**'
        - '**/scripts/**'
        - '**/seed.py*'
        - '**/seed_*'
        - '**/seeders/**'
        - '**/seeds.py*'
        - '**/seeds.rb*'
        - '**/seeds/**'
        - '**/test.py*'
        - '**/test/**'
        - '**/test_*'
        - '**/tests.py*'
        - '**/tests/**'
    metadata:
      cwe: 'CWE-78'
      owasp: 'A05'
      secaudit-id: 'SEC-AI-SHELL-TOOL'
      secaudit-severity: 'Medium'
      confidence: 'MEDIUM'
      category: security
      source: 'https://github.com/mtvrkan/secaudit'
