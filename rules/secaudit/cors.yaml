# SecAudit detector pack — `cors` group (1 rules).
#
# Generated by `python3 scripts/gen_semgrep_pack.py` from kit/secaudit_core/detectors.py.
# Do not edit by hand; CI fails on drift. See ../README.md for what is deliberately
# NOT in this pack and why.
rules:
  - id: secaudit.sec-cors-wildcard
    message: 'CORS allows any origin (*) (CWE-942, OWASP A05). Use an explicit origin allowlist, especially with credentials.'
    languages: [regex]
    severity: WARNING
    patterns:
      - pattern-regex: '(?im)Access-Control-Allow-Origin[''\"]?\s*[:,]\s*[''\"]\*[''\"]'
    paths:
      include:
        - '*.js'
        - '*.ts'
        - '*.py'
        - '*.go'
        - '*.java'
        - '*.rb'
        - '*.php'
    metadata:
      cwe: 'CWE-942'
      owasp: 'A05'
      secaudit-id: 'SEC-CORS-WILDCARD'
      secaudit-severity: 'Medium'
      confidence: 'MEDIUM'
      category: security
      source: 'https://github.com/mtvrkan/secaudit'
