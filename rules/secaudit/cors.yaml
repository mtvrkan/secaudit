    severity: WARNING
    patterns:
      - pattern-regex: '(?im)Access-Control-Allow-Origin[''\"]?\s*[:,]\s*[''\"]\*[''\"]'
    paths:
      include:
        - '*.js'
        - '*.jsx'
        - '*.mjs'
        - '*.cjs'
        - '*.ts'
        - '*.tsx'
        - '*.mts'
        - '*.cts'
        - '*.py'
        - '*.go'
        - '*.java'
        - '*.rb'
        - '*.php'
        - '*.phtml'
