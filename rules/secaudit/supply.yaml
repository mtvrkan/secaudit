# SecAudit detector pack — `supply` group (1 rules).
#
# Generated by `python3 scripts/gen_semgrep_pack.py` from kit/secaudit_core/detectors.py.
# Do not edit by hand; CI fails on drift. See ../README.md for what is deliberately
# NOT in this pack and why.
rules:
  - id: secaudit.sec-supply-curlpipe
    message: 'Remote script piped straight into a shell (CWE-494, OWASP A03). Download, verify a checksum/signature, then run — never pipe curl/wget to a shell.'
    languages: [regex]
    severity: ERROR
    patterns:
      - pattern-regex: '(?im)\b(?:curl|wget)\b[^\n|]*\|\s*(?:sudo\s+)?(?:sh|bash|zsh)\b'
    paths:
      include:
        - '*.sh'
        - '*.yml'
        - '*.yaml'
      exclude:
        - '**/*_factory.py'
        - '**/*_seed.py'
        - '**/*_test.py'
        - '**/*conftest.py'
        - '**/*seed.py'
        - '**/*seed_'
        - '**/*seeds.py'
        - '**/*seeds.rb'
        - '**/*test.py'
        - '**/*test_'
        - '**/*tests.py'
        - '**/_factory.py*'
        - '**/_seed.py*'
        - '**/_test.py*'
        - '**/benchmarks/**'
        - '**/conftest.py*'
        - '**/examples/**'
        - '**/factories/**'
        - '**/fixtures/**'
        - '**/management/commands/**'
        - '**/migrations/**'
        - '**/samples/**'
        - '**/scripts/**'
        - '**/seed.py*'
        - '**/seed_*'
        - '**/seeders/**'
        - '**/seeds.py*'
        - '**/seeds.rb*'
        - '**/seeds/**'
        - '**/test.py*'
        - '**/test/**'
        - '**/test_*'
        - '**/tests.py*'
        - '**/tests/**'
    metadata:
      cwe: 'CWE-494'
      owasp: 'A03'
      secaudit-id: 'SEC-SUPPLY-CURLPIPE'
      secaudit-severity: 'High'
      confidence: 'HIGH'
      category: security
      source: 'https://github.com/mtvrkan/secaudit'
