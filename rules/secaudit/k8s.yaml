# SecAudit detector pack — `k8s` group (4 rules).
#
# Generated by `python3 scripts/gen_semgrep_pack.py` from kit/secaudit_core/detectors.py.
# Do not edit by hand; CI fails on drift. See ../README.md for what is deliberately
# NOT in this pack and why.
rules:
  - id: secaudit.sec-k8s-privileged
    message: 'Privileged container (CWE-250, OWASP A05). Drop privileged; use least-privilege securityContext + capability drops.'
    languages: [regex]
    severity: ERROR
    patterns:
      - pattern-regex: '(?im)privileged:\s*true'
    paths:
      include:
        - '*.yaml'
        - '*.yml'
    metadata:
      cwe: 'CWE-250'
      owasp: 'A05'
      secaudit-id: 'SEC-K8S-PRIVILEGED'
      secaudit-severity: 'High'
      confidence: 'HIGH'
      category: security
      source: 'https://github.com/mtvrkan/secaudit'
  - id: secaudit.sec-k8s-privesc
    message: 'Privilege escalation allowed (CWE-250, OWASP A05). Set allowPrivilegeEscalation: false.'
    languages: [regex]
    severity: WARNING
    patterns:
      - pattern-regex: '(?im)allowPrivilegeEscalation:\s*true'
    paths:
      include:
        - '*.yaml'
        - '*.yml'
    metadata:
      cwe: 'CWE-250'
      owasp: 'A05'
      secaudit-id: 'SEC-K8S-PRIVESC'
      secaudit-severity: 'Medium'
      confidence: 'MEDIUM'
      category: security
      source: 'https://github.com/mtvrkan/secaudit'
  - id: secaudit.sec-k8s-hostpath
    message: 'hostPath volume mount (CWE-552, OWASP A05). Avoid hostPath; use PVCs / restricted volumes.'
    languages: [regex]
    severity: WARNING
    patterns:
      - pattern-regex: '(?im)hostPath:'
    paths:
      include:
        - '*.yaml'
        - '*.yml'
    metadata:
      cwe: 'CWE-552'
      owasp: 'A05'
      secaudit-id: 'SEC-K8S-HOSTPATH'
      secaudit-severity: 'Medium'
      confidence: 'MEDIUM'
      category: security
      source: 'https://github.com/mtvrkan/secaudit'
  - id: secaudit.sec-k8s-hostnet
    message: 'Host network / PID namespace shared (CWE-668, OWASP A05). Do not share the host network/PID/IPC namespaces.'
    languages: [regex]
    severity: WARNING
    patterns:
      - pattern-regex: '(?im)host(?:Network|PID|IPC):\s*true'
    paths:
      include:
        - '*.yaml'
        - '*.yml'
    metadata:
      cwe: 'CWE-668'
      owasp: 'A05'
      secaudit-id: 'SEC-K8S-HOSTNET'
      secaudit-severity: 'Medium'
      confidence: 'MEDIUM'
      category: security
      source: 'https://github.com/mtvrkan/secaudit'
