# SecAudit detector pack — `rs` group (1 rules).
#
# Generated by `python3 scripts/gen_semgrep_pack.py` from kit/secaudit_core/detectors.py.
# Do not edit by hand; CI fails on drift. See ../README.md for what is deliberately
# NOT in this pack and why.
rules:
  - id: secaudit.sec-rs-cmdi
    message: 'Shell command built with a shell interpreter (CWE-78, OWASP A03). Invoke the program directly with `Command::new(prog).arg(value)`; a `-c` string re-introduces shell metacharacter injection that Rust otherwise avoids.'
    languages: [regex]
    severity: WARNING
    patterns:
      - pattern-regex: '(?im)Command::new\(\s*\"(?:sh|bash|cmd|powershell)\"|\.arg\(\s*\"-c\"'
    paths:
      include:
        - '*.rs'
      exclude:
        - '**/*_factory.py'
        - '**/*_seed.py'
        - '**/*_test.py'
        - '**/*conftest.py'
        - '**/*seed.py'
        - '**/*seed_'
        - '**/*seeds.py'
        - '**/*seeds.rb'
        - '**/*test.py'
        - '**/*test_'
        - '**/*tests.py'
        - '**/_factory.py*'
        - '**/_seed.py*'
        - '**/_test.py*'
        - '**/benchmarks/**'
        - '**/conftest.py*'
        - '**/examples/**'
        - '**/factories/**'
        - '**/fixtures/**'
        - '**/management/commands/**'
        - '**/migrations/**'
        - '**/samples/**'
        - '**/scripts/**'
        - '**/seed.py*'
        - '**/seed_*'
        - '**/seeders/**'
        - '**/seeds.py*'
        - '**/seeds.rb*'
        - '**/seeds/**'
        - '**/test.py*'
        - '**/test/**'
        - '**/test_*'
        - '**/tests.py*'
        - '**/tests/**'
    metadata:
      cwe: 'CWE-78'
      owasp: 'A03'
      secaudit-id: 'SEC-RS-CMDI'
      secaudit-severity: 'Medium'
      confidence: 'MEDIUM'
      category: security
      source: 'https://github.com/mtvrkan/secaudit'
