    message: 'Possible SQL injection (Sprintf into SQL) (CWE-89, OWASP A03). Use parameterized queries (database/sql placeholders).'
    languages: [regex]
    severity: WARNING
    patterns:
      - pattern-regex: '(?im)fmt\.Sprintf\([^)]*\b(?:SELECT|INSERT|UPDATE|DELETE)\b'
