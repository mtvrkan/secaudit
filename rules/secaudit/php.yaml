  - id: secaudit.sec-php-xss-echo
    message: 'Superglobal echoed into the page without escaping (CWE-79, OWASP A03). Escape at the point of output: `htmlspecialchars($v, ENT_QUOTES, ''UTF-8'')`, or render through a template engine that escapes by default. PHP escapes nothing on its own, so an unescaped superglobal in `echo` is reflected XSS.'
