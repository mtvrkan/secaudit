  - id: secaudit.sec-php-sqli-superglobal
    message: 'Superglobal passed straight into a query call (CWE-89, OWASP A03). Bind the value instead of pasting it: `$stmt = $pdo->prepare(''… WHERE id = ?''); $stmt->execute([$id]);`. A superglobal inside the query TEXT is injection even when the call is named `prepare`.'
