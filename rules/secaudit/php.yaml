  - id: secaudit.sec-php-xss-shortecho
    message: 'Value printed by the short-echo tag with nothing escaping it (CWE-79, OWASP A03). Escape at the tag: `<?= htmlspecialchars($v, ENT_QUOTES, ''UTF-8'') ?>`, or move the page to a template engine that escapes by default. Nothing in PHP escapes this value on its own, and every string on the page reached it from somewhere.'
    languages: [regex]
    severity: WARNING
    patterns:
      - pattern-regex: '(?im)<\?=\s*\$[A-Za-z_]\w*(?:\s*(?:->|::)\s*\w+|\s*\[[^\]\n]*\])*\s*(?:;|\?>)'
