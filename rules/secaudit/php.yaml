rules:
  - id: secaudit.sec-php-unser
    message: 'Insecure deserialization (unserialize) (CWE-502, OWASP A08). Never unserialize untrusted data; use JSON. If the call has to stay, pass `[''allowed_classes'' => false]` so no object can be constructed.'
    languages: [regex]
    severity: ERROR
    patterns:
      - pattern-regex: '(?im)(?<![\w>:$])(?<!function )unserialize\s*\((?!(?:[^()\n]|\([^()\n]*\))*allowed_classes)'
    paths:
      include:
        - '*.php'
