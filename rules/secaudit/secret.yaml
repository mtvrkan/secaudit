# SecAudit detector pack — `secret` group (13 rules).
#
# Generated by `python3 scripts/gen_semgrep_pack.py` from kit/secaudit_core/detectors.py.
# Do not edit by hand; CI fails on drift. See ../README.md for what is deliberately
# NOT in this pack and why.
rules:
  - id: secaudit.sec-secret-aws
    message: 'Hardcoded AWS access key id (CWE-798, OWASP A07). Remove the secret from source, rotate it, and load from a secret manager / env.'
    languages: [regex]
    severity: ERROR
    patterns:
      - pattern-regex: '(?m)AKIA[0-9A-Z]{16}'
    paths:
      include:
        - '*.js'
        - '*.ts'
        - '*.py'
        - '*.json'
        - '*.env'
        - '*.txt'
        - 'Dockerfile'
    metadata:
      cwe: 'CWE-798'
      owasp: 'A07'
      secaudit-id: 'SEC-SECRET-AWS'
      secaudit-severity: 'High'
      confidence: 'HIGH'
      category: security
      source: 'https://github.com/mtvrkan/secaudit'
      # This rule matches credential material. Semgrep prints the matched line; SecAudit redacts it.
  - id: secaudit.sec-secret-gh
    message: 'Hardcoded GitHub token (CWE-798, OWASP A07). Revoke the token, rotate it, and load from a secret manager.'
    languages: [regex]
    severity: ERROR
    patterns:
      - pattern-regex: '(?m)\bgh[pousr]_[A-Za-z0-9]{36,}\b'
    paths:
      include:
        - '*.js'
        - '*.ts'
        - '*.py'
        - '*.go'
        - '*.rb'
        - '*.php'
        - '*.java'
        - '*.cs'
        - '*.json'
