# SecAudit detector pack — `ci` group (1 rules).
#
# Generated by `python3 scripts/gen_semgrep_pack.py` from kit/secaudit_core/detectors.py.
# Do not edit by hand; CI fails on drift. See ../README.md for what is deliberately
# NOT in this pack and why.
rules:
  - id: secaudit.sec-ci-mutable-action
    message: 'GitHub Action pinned to a mutable branch ref (CWE-1357, OWASP A03). Pin third-party Actions to a full commit SHA — a branch is mutable and can be repointed at malicious code (the tj-actions/changed-files CVE-2025-30066 class, where the attacker moved the refs rather than publishing new code). Dependabot can still bump the pin. A version tag is better than a branch, a SHA is safest.'
    languages: [regex]
    severity: ERROR
    patterns:
      - pattern-regex: '(?im)uses:\s*[\w.\-]+/[\w.\-]+@(?:(?:main|master|develop|trunk|latest|stable|HEAD)\b|[\w.\-]+/[\w.\-]+)'
    paths:
      include:
        - '*.yml'
        - '*.yaml'
      exclude:
        - '**/*_factory.py'
        - '**/*_seed.py'
        - '**/*_test.py'
        - '**/*conftest.py'
        - '**/*seed.py'
        - '**/*seed_'
        - '**/*seeds.py'
        - '**/*seeds.rb'
        - '**/*test.py'
        - '**/*test_'
        - '**/*tests.py'
        - '**/_factory.py*'
        - '**/_seed.py*'
        - '**/_test.py*'
        - '**/benchmarks/**'
        - '**/conftest.py*'
        - '**/examples/**'
        - '**/factories/**'
        - '**/fixtures/**'
        - '**/management/commands/**'
        - '**/migrations/**'
        - '**/samples/**'
        - '**/scripts/**'
        - '**/seed.py*'
        - '**/seed_*'
        - '**/seeders/**'
        - '**/seeds.py*'
        - '**/seeds.rb*'
        - '**/seeds/**'
        - '**/test.py*'
        - '**/test/**'
        - '**/test_*'
        - '**/tests.py*'
        - '**/tests/**'
    metadata:
      cwe: 'CWE-1357'
      owasp: 'A03'
      secaudit-id: 'SEC-CI-MUTABLE-ACTION'
      secaudit-severity: 'High'
      confidence: 'HIGH'
      category: security
      source: 'https://github.com/mtvrkan/secaudit'
